 resources:
  jobs:
    sales_job:
      name: sales_cicd_job

      # Run every hour to check for new files
      schedule:
        quartz_cron_expression: '0 0/15 * * * ?'  # Every hour
        timezone_id: 'UTC'
        pause_status: 'UNPAUSED'
      
      tasks:
        - task_key: quality_report

          notebook_task:
            notebook_path: ../src/00_data_quality_report.ipynb

        - task_key: bronze
          depends_on:
            - task_key: quality_report
          notebook_task:
            notebook_path: ../src/01_bronze_ingestion.ipynb

        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ../src/02_silver_cleaning.ipynb

        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ../src/03_gold_analytics.ipynb



