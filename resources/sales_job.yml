resources:
  jobs:
    sales_job:
      name: sales_cicd_job

      # Automatic trigger when new files arrive
      trigger:
        file_arrival:
          url: '/Volumes/workspace/default/sales_volume/'  # Replace with your actual path
          min_time_between_triggers_seconds: 60 
          wait_after_last_change_seconds: 60     
      tasks:
        - task_key: quality_report

          notebook_task:
            notebook_path: ../src/00_data_quality_report.ipynb

        - task_key: bronze
          depends_on:
            - task_key: quality_report
          notebook_task:
            notebook_path: ../src/01_bronze_ingestion.ipynb

        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ../src/02_silver_cleaning.ipynb

        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ../src/03_gold_analytics.ipynb



